<!DOCTYPE html>
<html>
<head>
  <title>Image Map</title>
</head>
<body>
  <img src="worldmap.jpg"  width="400" height="200">

  <map name="worldmap">
    <area shape="rect" coords="34,44,270,350" href="https://en.wikipedia.org/wiki/Asia" alt="Asia">
    <area shape="circle" coords="337,300,44" href="https://en.wikipedia.org/wiki/Africa" alt="Africa">
  </map>
</body>
</html>
