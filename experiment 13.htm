<!DOCTYPE html>
<html>
<head>
  <title>Lists Example</title>
</head>
<body>
  <h3>Ordered List (Fruits)</h3>
  <ol>
    <li>Apple</li>
    <li>Banana</li>
    <li>Mango</li>
  </ol>

  <h3>Unordered List (Colors)</h3>
  <ul>
    <li>Red</li>
    <li>Blue</li>
    <li>Green</li>
  </ul>
</body>
</html>
